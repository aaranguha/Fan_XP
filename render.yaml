services:
  - type: web
    name: fanxp-api
    runtime: python
    plan: free
    rootDir: fanxp_app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn fanxp_api:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: STH_PHONE
        sync: false
      - key: TWILIO_DRY_RUN
        value: "true"
