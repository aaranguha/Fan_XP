name: NFL Game Runner

on:
  schedule:
    # ONE trigger per day, at 10 AM UTC = 6 AM ET, every day of the week.
    # The runner finds all of today's home games and each game subprocess
    # sleeps until its own kickoff - 60 min, so an early start costs nothing.
    #
    # This replaced "0 17 * * 0" + "0 23 * * *", which were set to fire right
    # around the pre-game window and in practice fired ~2 hours late EVERY
    # time (observed 2026-09-13 through 09-24: the 23:00 trigger landed at
    # 00:46-01:28 UTC, the Sunday 17:00 one at ~19:10). That put the
    # "pre-game" scrape after kickoff for every primetime game and every
    # 1 PM ET Sunday game: the 9/14 Chiefs and 9/17 Bills "pre-game" and
    # "halftime" scrapes ran 2 minutes apart (fabricated ~100% no-show
    # rates), 9/20's 1 PM games all got 0 listings (page already off-sale),
    # and 9/21 MNF / 9/24 TNF got nothing. Even an on-time 17:00 was too
    # late: 1 PM ET kickoff is 17:00 UTC, so its pre-game was due at 16:00.
    # Keep this trigger hours ahead of the earliest kickoff so a multi-hour
    # scheduler delay still lands before any pre-game scrape. Longest day
    # (SNF ~00:20 UTC kickoff + 45 min) is ~16h from 10:00 UTC, inside the
    # 24h timeout below. Firing every day is cheap -- nfl_runner.py exits
    # immediately if there is no home game.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nfl:
    runs-on: [self-hosted, nfl-runner]
    # Was 360 (6h), then 720 (12h) -- neither was enough. Confirmed live on
    # 2026-09-09: a manual restart at 07:22 UTC for an unrelated code fix,
    # with kickoff not until 00:20 UTC the next day (pregame scrape at
    # 23:20 UTC) needed the job to stay alive ~16h -- the 720-minute cap
    # killed it 4 hours before it ever reached the scrape. A scheduled
    # trigger can also fire hours late under platform load (2026-08-28: an
    # ~8h-late fire). 1440 (24h) covers both a late-firing trigger and a
    # same-day restart well before a late kickoff, plus the wait for
    # halftime after.
    timeout-minutes: 1440

    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
      GIT_USER_NAME:        "github-actions[bot]"
      GIT_USER_EMAIL:       "github-actions[bot]@users.noreply.github.com"
      HEADLESS_BROWSER:     "0"
      PYTHONUNBUFFERED:     "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: .venv/bin/python -m playwright install chromium

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Cancelling a job on a self-hosted runner stops the wrapper process,
      # but nfl_runner.py's per-team subprocesses (spawned via
      # subprocess.Popen) aren't always reaped with it -- confirmed live
      # 2026-09-09: several cancel-and-restart cycles that morning left an
      # orphaned seahawks subprocess running for hours, which later woke up
      # and duplicated a pregame/halftime cycle a completed run had already
      # done. Kill any leftover instances before this run starts its own.
      - name: Clean up orphaned scrapers from a previous cancelled run
        run: pkill -f "nfl_run_game.py" || true

      - name: Run NFL daily runner
        run: |
          cd scraping
          ../.venv/bin/python nfl_runner.py

      - name: Upload game logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-logs
          path: scraping/data/nfl/**/game.log
          if-no-files-found: ignore
