name: NFL Game Runner

on:
  schedule:
    # Sunday 5 PM UTC = noon ET — catches 1 PM ET afternoon games
    - cron: "0 17 * * 0"
    # Sunday 11 PM UTC = 6 PM ET — catches Sunday Night Football (8:20 PM ET kick-off)
    - cron: "0 23 * * 0"
    # Monday 11 PM UTC = 6 PM ET — catches Monday Night Football (8:15 PM ET)
    - cron: "0 23 * * 1"
    # Thursday 11 PM UTC = 6 PM ET — catches Thursday Night Football (8:15 PM ET)
    - cron: "0 23 * * 4"
    # Friday/Saturday 11 PM UTC — preseason and occasional regular-season
    # games run on these days too; the regular Sun/Mon/Thu-only schedule
    # missed a real preseason game entirely (confirmed 2026-08-28).
    - cron: "0 23 * * 5"
    - cron: "0 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nfl:
    runs-on: [self-hosted, nfl-runner]
    # Was 360 (6h) -- too short. GitHub's scheduled triggers can fire hours
    # late under platform load (confirmed: the 2026-08-28 game was caught
    # by a Thursday-23:00-UTC cron that actually fired ~8h late, at Friday
    # 06:50 UTC), and from there the runner still has to wait for kickoff
    # (evening games) plus reach halftime. 360 minutes killed that run
    # before it ever captured data.
    timeout-minutes: 720

    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
      GIT_USER_NAME:        "github-actions[bot]"
      GIT_USER_EMAIL:       "github-actions[bot]@users.noreply.github.com"
      HEADLESS_BROWSER:     "0"
      PYTHONUNBUFFERED:     "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: .venv/bin/python -m playwright install chromium

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run NFL daily runner
        run: |
          cd scraping
          ../.venv/bin/python nfl_runner.py

      - name: Upload game logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-logs
          path: scraping/data/nfl/**/game.log
          if-no-files-found: ignore
