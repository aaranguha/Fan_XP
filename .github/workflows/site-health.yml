name: Site Health Check

# Checks that the live product is actually reachable: the Render API and
# the Vercel static site. Runs on a GitHub-hosted runner deliberately -
# the QA cloud agent's sandbox has an organization network policy that
# blocks egress to arbitrary external hosts (confirmed live: both curl
# and WebFetch returned EGRESS_BLOCKED for fanxp-api.onrender.com and
# fan-xp.vercel.app from that environment, see issue #4), so it could
# never actually perform this check. GitHub Actions runners have normal
# internet access, so this lives here instead.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Render API and Vercel site
        id: check
        run: |
          set +e
          problems=""

          # Render's free tier cold-starts after inactivity - confirmed
          # first request can take 30-60s (per CLAUDE.md). A 20s timeout
          # produced a false "down" alert on this workflow's very first
          # run when it was actually just cold-starting. 65s covers a
          # real cold start; anything slower than that really is a problem.
          render_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 65 https://fanxp-api.onrender.com/)
          # A 404 is fine - the Flask app has no root route. "000" (timeout/
          # connection failure) or 5xx means it's actually down.
          if [ "$render_code" = "000" ] || [ "$render_code" -ge 500 ]; then
            problems="${problems}Render API (fanxp-api.onrender.com) returned HTTP ${render_code} after a 65s timeout.\n"
          fi

          vercel_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://fan-xp.vercel.app/)
          if [ "$vercel_code" != "200" ]; then
            problems="${problems}Vercel site (fan-xp.vercel.app) returned HTTP ${vercel_code} instead of 200.\n"
          fi

          # Spot-check that the homepage actually contains real content, not
          # an empty shell or a Vercel error page.
          body=$(curl -s --max-time 20 https://fan-xp.vercel.app/)
          if [ -z "$body" ] || echo "$body" | grep -qi "404: NOT_FOUND\|This page could not be found"; then
            problems="${problems}Vercel homepage body looks broken/empty, not real content.\n"
          fi

          set -e
          if [ -n "$problems" ]; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            {
              echo "problems<<EOF"
              echo -e "$problems"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo -e "PROBLEMS FOUND:\n$problems"
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "Render: ${render_code}, Vercel: ${vercel_code} - both healthy."
          fi

      - name: File an issue and notify (only if something was found)
        if: steps.check.outputs.found == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # gh's --search does fuzzy full-text matching, not a literal
          # substring match - confirmed live, it matched issue #4 (a
          # *different*, already-existing issue whose title and body just
          # happen to mention "site health" in prose) instead of finding
          # no match. Filter by an exact title prefix instead.
          existing=$(gh issue list --repo aaranguha/Fan_XP --state open --json number,title \
            --jq '[.[] | select(.title | startswith("[site-health]"))][0].number')

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo aaranguha/Fan_XP --body "Still failing as of $(date -u +%Y-%m-%dT%H:%M:%SZ):
          ${{ steps.check.outputs.problems }}"
          else
            gh issue create --repo aaranguha/Fan_XP \
              --title "[site-health] Live site unreachable - $(date -u +%Y-%m-%d)" \
              --body "${{ steps.check.outputs.problems }}

          Checked by the scheduled Site Health Check workflow."
          fi

          # Not routed through notify.yml/workflow_dispatch: the default
          # per-run GITHUB_TOKEN is deliberately forbidden from triggering
          # another workflow (GitHub's built-in anti-recursion guard, to
          # stop workflows from chain-triggering each other) - confirmed
          # live, this returned a 403 the first time this workflow ran.
          # That bridge exists for the cloud agents, which have no secrets
          # of their own; this workflow already has the real Telegram
          # secrets directly, so it can just call the API itself.
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Fan_XP site health check found a problem - see the [site-health] GitHub issue for details."
