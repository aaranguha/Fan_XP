name: MLB Game Runner

on:
  schedule:
    # Fire every 2 hours during the MLB window (17:00–03:00 UTC).
    # Each run only launches games whose pre-game is within the next 6 hours.
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
    - cron: "0 23 * * *"
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to run (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      team:
        description: "Single team slug to test (e.g. yankees). Leave blank for all."
        required: false
        default: ""
      now:
        description: "Skip sleep and scrape immediately (for testing)."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run-mlb:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SEATGEEK_CLIENT_ID:   ${{ secrets.SEATGEEK_CLIENT_ID }}
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
      GIT_USER_NAME:        "github-actions[bot]"
      GIT_USER_EMAIL:       "github-actions[bot]@users.noreply.github.com"
      HEADLESS_BROWSER:     "1"
      PYTHONUNBUFFERED:     "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: .venv/bin/python -m playwright install chromium

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run MLB daily runner
        run: |
          if [ -n "${{ github.event.inputs.team }}" ]; then
            NOW_FLAG=${{ github.event.inputs.now == 'true' && '--now' || '' }}
            .venv/bin/python mlb_run_game.py ${{ github.event.inputs.team }} ${{ github.event.inputs.date }} $NOW_FLAG
          else
            .venv/bin/python mlb_runner.py ${{ github.event.inputs.date }}
          fi

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-failure-screenshots
          path: data/mlb/**/tm_failure.png
          if-no-files-found: ignore
