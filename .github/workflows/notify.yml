name: Notify

# Lets something without access to repo secrets (e.g. the monitoring cloud
# agent set up to watch NFL Game Runner health) send a Telegram message
# through this repo's existing bot, without ever handing that agent the
# actual token. It just triggers this workflow with a message; the secret
# stays inside GitHub Actions the whole time.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message to send to the Fan XP Telegram chat"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE:             ${{ github.event.inputs.message }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
