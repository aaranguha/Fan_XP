name: Notify

# Bridge the cloud agents (QA, pitch-readiness, nightly digest) call to
# "send" an alert without holding any secrets.
#
# It no longer forwards to Telegram: the founder asked (2026-09-24) for
# Telegram to carry only per-game scrape outcomes, which nfl_run_game.py
# sends directly. Agent messages are written to this run's job summary
# instead (Actions tab -> Notify -> run), so nothing is lost and the agents'
# dispatch calls keep succeeding.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message from an agent (logged, not sent to Telegram)"
        required: true

permissions: {}

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Record message
        env:
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          echo "$MESSAGE"
          {
            echo "### Agent message"
            echo
            echo "$MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"
