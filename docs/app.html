<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fan XP</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#fafaf9" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fan XP" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #fafaf9;
      --surface:  #ffffff;
      --border:   #e7e6e2;
      --text:     #16181c;
      --muted:    #6d7076;
      --muted-2:  #9a9da3;
      --accent:   #2f5fff;
      --sans:     'Inter', sans-serif;
      --serif:    'Fraunces', serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    .container { max-width: 560px; margin: 0 auto; padding: 0 18px; }

    header { padding: 28px 0 16px; text-align: center; }
    .logo { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; letter-spacing: -.01em; }
    .logo .xp { color: var(--accent); font-style: italic; }
    header p { color: var(--muted); font-size: .85rem; margin-top: 6px; }

    .search-wrap { position: relative; margin: 18px 0 20px; }
    .search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }
    .search-input {
      width: 100%; padding: 12px 16px 12px 42px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: var(--sans); font-size: .9rem; outline: none;
    }
    .search-input:focus { border-color: var(--text); }

    .conf-title {
      font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted-2); margin: 22px 0 10px;
    }
    .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .team-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: border-color .15s;
    }
    .team-card:active { transform: scale(.96); }
    .team-logo { width: 38px; height: 38px; object-fit: contain; }
    .team-name { font-size: .66rem; font-weight: 700; text-align: center; line-height: 1.25; }
    .team-city { font-size: .58rem; color: var(--muted); text-align: center; }

    .install-hint {
      margin: 30px 0 10px; text-align: center; font-size: .72rem; color: var(--muted);
      padding: 10px 14px; border: 1px dashed var(--border); border-radius: 10px;
    }
    footer { text-align: center; padding: 24px 0 32px; font-size: .68rem; color: var(--muted-2); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Fan<span class="xp"> XP</span></div>
      <p>Claim empty NFL seats for the 2nd half</p>
    </header>

    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Search teams…" oninput="filterTeams(this.value)" />
    </div>

    <div id="teams"></div>

    <div class="install-hint" id="installHint" style="display:none;">
      Tap <strong>Share → Add to Home Screen</strong> to install Fan XP as an app.
    </div>

    <footer>Fan XP · NFL preview · <a href="privacy.html" style="color:inherit;text-decoration:underline;">Privacy</a> · <a href="terms.html" style="color:inherit;text-decoration:underline;">Terms</a></footer>
  </div>

  <script>
    const NFL_TEAMS = [
      ['bills','Buffalo Bills','Orchard Park','#00338D','buf'],
      ['dolphins','Miami Dolphins','Miami Gardens','#008E97','mia'],
      ['patriots','New England Patriots','Foxborough','#002244','ne'],
      ['jets','New York Jets','East Rutherford','#125740','nyj'],
      ['ravens','Baltimore Ravens','Baltimore','#241773','bal'],
      ['bengals','Cincinnati Bengals','Cincinnati','#FB4F14','cin'],
      ['browns','Cleveland Browns','Cleveland','#311D00','cle'],
      ['steelers','Pittsburgh Steelers','Pittsburgh','#FFB612','pit'],
      ['texans','Houston Texans','Houston','#03202F','hou'],
      ['colts','Indianapolis Colts','Indianapolis','#002C5F','ind'],
      ['jaguars','Jacksonville Jaguars','Jacksonville','#101820','jax'],
      ['titans','Tennessee Titans','Nashville','#0C2340','ten'],
      ['broncos','Denver Broncos','Denver','#FB4F14','den'],
      ['chiefs','Kansas City Chiefs','Kansas City','#E31837','kc'],
      ['raiders','Las Vegas Raiders','Las Vegas','#000000','lv'],
      ['chargers','Los Angeles Chargers','Inglewood','#0080C6','lac'],
      ['cowboys','Dallas Cowboys','Arlington','#041E42','dal'],
      ['giants','New York Giants','East Rutherford','#0B2265','nyg'],
      ['eagles','Philadelphia Eagles','Philadelphia','#004C54','phi'],
      ['commanders','Washington Commanders','Landover','#5A1414','wsh'],
      ['bears','Chicago Bears','Chicago','#0B162A','chi'],
      ['lions','Detroit Lions','Detroit','#0076B6','det'],
      ['packers','Green Bay Packers','Green Bay','#203731','gb'],
      ['vikings','Minnesota Vikings','Minneapolis','#4F2683','min'],
      ['falcons','Atlanta Falcons','Atlanta','#A71930','atl'],
      ['panthers','Carolina Panthers','Charlotte','#0085CA','car'],
      ['saints','New Orleans Saints','New Orleans','#D3BC8D','no'],
      ['buccaneers','Tampa Bay Buccaneers','Tampa','#D50A0A','tb'],
      ['cardinals','Arizona Cardinals','Glendale','#97233F','ari'],
      ['rams','Los Angeles Rams','Inglewood','#003594','lar'],
      ['49ers','San Francisco 49ers','Santa Clara','#AA0000','sf'],
      ['seahawks','Seattle Seahawks','Seattle','#002244','sea'],
    ];

    const shortName = full => full.replace(/^(New England|New Orleans|New York|Green Bay|Tampa Bay|Los Angeles|Las Vegas|San Francisco|Kansas City)\s/, '');

    const teamsEl = document.getElementById('teams');

    function renderGrid(){
      teamsEl.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'teams-grid';
      teamsEl.appendChild(grid);
      NFL_TEAMS.forEach(([slug, full, city, color, espn]) => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.dataset.team = full;
        card.onclick = () => { window.location.href = `nfl_${slug}_seatmap.html`; };
        card.innerHTML = `
          <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${espn}.png" alt="${full}">
          <div class="team-name">${shortName(full)}</div>
          <div class="team-city">${city}</div>
        `;
        grid.appendChild(card);
      });
    }
    renderGrid();

    function filterTeams(query){
      const q = query.toLowerCase();
      document.querySelectorAll('.team-card').forEach(card => {
        card.style.display = card.dataset.team.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    // iOS gives no native install prompt — nudge with a hint instead.
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIOS && !isStandalone) {
      document.getElementById('installHint').style.display = 'block';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
