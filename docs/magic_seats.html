<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Magic · Empty Seats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05070d;
  --f:'Inter',sans-serif;
  --orange:#ff6b2b;
  --sold:rgba(60,120,220,.28);
  --dim:rgba(160,185,230,.35);
  --border:rgba(255,255,255,.07);
}
html,body{font-family:var(--f);background:var(--bg);color:#e8eeff;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;}
#shell{display:flex;flex-direction:column;height:100vh;}

/* top */
#top{
  flex:none;height:50px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;border-bottom:1px solid var(--border);
  background:rgba(5,7,13,.98);z-index:10;
}
#brand{font-size:.7rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(200,220,255,.45);}
#toggle{display:flex;gap:6px;}
.tog{
  font-family:var(--f);font-size:.65rem;font-weight:600;letter-spacing:.05em;
  background:transparent;border:1px solid var(--border);color:var(--dim);
  padding:5px 14px;border-radius:999px;cursor:pointer;transition:all .18s;
}
.tog.on{color:#fff;background:rgba(255,107,43,.15);border-color:rgba(255,107,43,.5);}
.tog:hover:not(.on){border-color:rgba(255,255,255,.18);color:#fff;}

/* stage */
#stage{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:18px 0 0;gap:10px;
  overflow:hidden;min-height:0;
}

/* headline */
#hl{flex:none;text-align:center;}
#hl h2{font-size:1.2rem;font-weight:800;letter-spacing:-.03em;color:#fff;margin-bottom:4px;}
#hl p{font-size:.67rem;color:var(--dim);}
.hi{color:var(--orange);}

/* arena SVG */
#arena-wrap{
  flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;min-height:0;
}
#svg-arena{width:100%;max-height:100%;display:block;}

/* dots */
.d-sold{fill:var(--sold);opacity:0;transition:opacity .2s;}
.d-ns{fill:var(--orange);opacity:0;}

@keyframes pop{
  0%  {opacity:0;r:1.5;}
  65% {opacity:1;r:5.5;}
  100%{opacity:1;r:4;}
}
@keyframes breathe{
  0%,100%{opacity:.8;}
  50%{opacity:1;}
}
.d-ns.lit{
  animation:pop .28s ease forwards, breathe 3s ease-in-out .28s infinite;
  filter:drop-shadow(0 0 3px rgba(255,107,43,.7));
}

/* stats */
#stats{
  flex:none;display:flex;align-items:stretch;justify-content:center;
  height:56px;border-top:1px solid var(--border);background:rgba(5,7,13,.98);
}
.stat{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 28px;border-right:1px solid var(--border);gap:1px;
}
.stat:last-child{border-right:none;}
.sv{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.sl{font-size:.52rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.or{color:var(--orange);} .rd{color:#f87171;}

/* legend */
#legend{position:absolute;right:18px;bottom:64px;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.lrow{display:flex;align-items:center;gap:8px;}
.ld{width:9px;height:9px;border-radius:50%;flex:none;}
.ld.ns{background:var(--orange);box-shadow:0 0 5px rgba(255,107,43,.6);}
.ld.sd{background:rgba(60,120,220,.5);border:1px solid rgba(100,160,255,.2);}
.ll{font-size:.58rem;font-weight:500;color:var(--dim);}
</style>
</head>
<body>
<div id="shell">
  <div id="top">
    <span id="brand">Magic &nbsp;·&nbsp; Kia Center</span>
    <div id="toggle"></div>
  </div>
  <div id="stage">
    <div id="hl">
      <h2>Every seat. Half the game. <span class="hi">No one in it.</span></h2>
      <p>Each dot is a real seat still listed on Ticketmaster at halftime — spatially placed in the arena.</p>
    </div>
    <div id="arena-wrap">
      <svg id="svg-arena" viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">

        <!-- arena shell -->
        <ellipse cx="500" cy="560" rx="490" ry="390" fill="#080c18"/>
        <!-- concourse ring suggestions -->
        <ellipse cx="500" cy="560" rx="315" ry="250" fill="none" stroke="rgba(255,255,255,.03)" stroke-width="8"/>
        <ellipse cx="500" cy="560" rx="128" ry="102" fill="none" stroke="rgba(255,255,255,.03)" stroke-width="6"/>

        <!-- court -->
        <rect x="405" y="502" width="190" height="18"
              fill="#b87820" rx="4" opacity=".22"/>
        <rect x="405" y="502" width="190" height="18"
              fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5" rx="4"/>
        <text x="500" y="520" text-anchor="middle"
              font-size="9" font-family="Inter,sans-serif" font-weight="700"
              letter-spacing="3" fill="rgba(255,255,255,.18)">COURT</text>

        <!-- tier arc labels -->
        <text x="500" y="175" text-anchor="middle"
              font-size="8" font-family="Inter,sans-serif" font-weight="600"
              letter-spacing="2" fill="rgba(160,185,230,.12)">UPPER DECK</text>
        <text x="500" y="352" text-anchor="middle"
              font-size="8" font-family="Inter,sans-serif" font-weight="600"
              letter-spacing="2" fill="rgba(160,185,230,.10)">LOWER BOWL</text>

        <!-- dots injected by JS -->
        <g id="dots"></g>
      </svg>
    </div>

    <div id="legend">
      <div class="lrow"><div class="ld ns"></div><span class="ll">Empty at halftime</span></div>
      <div class="lrow"><div class="ld sd"></div><span class="ll">Sold / attended</span></div>
    </div>
  </div>

  <div id="stats">
    <div class="stat"><span class="sv" id="sv-pre">—</span><span class="sl">Listed pre-game</span></div>
    <div class="stat"><span class="sv or" id="sv-ns">—</span><span class="sl">Empty at halftime</span></div>
    <div class="stat"><span class="sv or" id="sv-rate">—</span><span class="sl">No-show rate</span></div>
    <div class="stat"><span class="sv rd" id="sv-dead">—</span><span class="sl">Dead inventory</span></div>
  </div>
</div>

  b.textContent = g.label;
  b.onclick = () => setGame(i);
  tog.appendChild(b);
});

const SVG_NS = 'http://www.w3.org/2000/svg';
let timers = [];
function clearAll() { timers.forEach(clearTimeout); timers=[]; document.getElementById('dots').innerHTML=''; }

function countUp(id, target, pre, suf, ms) {
  const el = document.getElementById(id), t0 = performance.now();
  (function tick(now) {
    const t = Math.min((now-t0)/ms, 1);
    el.textContent = pre + Math.round((1-Math.pow(1-t,3))*target).toLocaleString() + suf;
    if (t<1) requestAnimationFrame(tick);
  })(t0);
}

function render(idx) {
  clearAll();
  const g = GAMES[idx];
  const dotsG = document.getElementById('dots');

  const ns_els = [], sold_els = [];
  g.dots.forEach(d => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', d[0]);
    c.setAttribute('cy', d[1]);
    c.setAttribute('r',  d[2] ? '4' : '3.2');
    c.setAttribute('class', d[2] ? 'd-ns' : 'd-sold');
    if (d[2] && d[3]) c.setAttribute('title', '$' + d[3]);
    dotsG.appendChild(c);
    (d[2] ? ns_els : sold_els).push(c);
  });

  // Sold: fade in
  timers.push(setTimeout(() => sold_els.forEach(el => el.style.opacity='1'), 200));

  // No-shows: sweep clockwise (sort by angle from arena center)
  const sorted_ns = [...ns_els].sort((a,b) => {
    const ax = parseFloat(a.getAttribute('cx')) - 500;
    const ay = parseFloat(a.getAttribute('cy')) - 560;
    const bx = parseFloat(b.getAttribute('cx')) - 500;
    const by = parseFloat(b.getAttribute('cy')) - 560;
    return Math.atan2(ay,ax) - Math.atan2(by,bx);
  });

  const sweep = 1500;
  sorted_ns.forEach((el,i) => {
    const d = 500 + (i / Math.max(sorted_ns.length-1,1)) * sweep;
    timers.push(setTimeout(() => el.classList.add('lit'), d));
  });

  timers.push(setTimeout(() => {
    countUp('sv-pre',  g.n_pre, '', '',   850);
    countUp('sv-ns',   g.n_ns,  '', '',   850);
    countUp('sv-rate', Math.round(g.n_ns/g.n_pre*100), '', '%', 800);
    countUp('sv-dead', g.dead,  '$', '', 1000);
  }, 650));
}

function setGame(idx) {
  document.querySelectorAll('.tog').forEach((b,i) => b.classList.toggle('on', i===idx));
  ['sv-pre','sv-ns','sv-rate','sv-dead'].forEach(id => document.getElementById(id).textContent='—');
  render(idx);
}

render(0);
</script>
